<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TabVault</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <input id="q" type="search" placeholder="Search tabs, sessions, workspaces…  (↑ ↓ Enter)" aria-label="Search" autofocus />
      <button id="gear" class="icon" title="Settings" aria-label="Settings">⚙</button>
    </header>
    <nav id="nav" role="tablist">
      <button role="tab" data-view="tabs" aria-selected="true">Tabs</button>
      <button role="tab" data-view="workspaces" aria-selected="false">Workspaces</button>
      <button role="tab" data-view="sessions" aria-selected="false">Sessions</button>
    </nav>
    <main id="main" aria-live="polite"></main>
    <footer id="stats"></footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
