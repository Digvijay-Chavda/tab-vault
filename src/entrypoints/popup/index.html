<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TabVault</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <span class="brand" id="brand" aria-hidden="true"></span>
      <div class="search">
        <span class="search-icon" id="search-icon" aria-hidden="true"></span>
        <input id="q" type="search" placeholder="Search tabs, sessions, workspaces…" aria-label="Search" autofocus />
      </div>
      <button id="palette" class="icon" title="Commands (Ctrl+K)" aria-label="Commands"></button>
      <button id="gear" class="icon" title="Settings" aria-label="Settings"></button>
    </header>
    <nav id="nav" role="tablist">
      <button role="tab" data-view="tabs" aria-selected="true">
        <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="14" height="12" rx="2"/><path d="M7 7V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-2"/></svg>
        <span>Tabs <span class="count" data-count="tabs"></span></span>
      </button>
      <button role="tab" data-view="stash" aria-selected="false">
        <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="4" rx="1.5"/><path d="M5 11v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/><path d="M10 15h4"/></svg>
        <span>Stash <span class="count" data-count="stash"></span></span>
      </button>
      <button role="tab" data-view="workspaces" aria-selected="false">
        <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>
        <span>Workspaces <span class="count" data-count="workspaces"></span></span>
      </button>
      <button role="tab" data-view="sessions" aria-selected="false">
        <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
        <span>Sessions <span class="count" data-count="sessions"></span></span>
      </button>
      <button role="tab" data-view="closed" aria-selected="false">
        <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10h10a6 6 0 0 1 0 12H9"/><path d="M8 5 3 10l5 5"/></svg>
        <span>Closed <span class="count" data-count="closed"></span></span>
      </button>
      <button role="tab" data-view="insights" aria-selected="false">
        <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V11"/><path d="M12 20V4"/><path d="M20 20v-7"/></svg>
        <span>Insights</span>
      </button>
    </nav>
    <main id="main"></main>
    <p id="toast" role="status" aria-live="polite"></p>
    <footer>
      <span id="stats"></span>
      <span class="hint"><kbd>↑</kbd><kbd>↓</kbd> move <kbd>Enter</kbd> open</span>
    </footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
